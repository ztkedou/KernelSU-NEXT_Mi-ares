name: Build KernelSU-Next for ares (K40 Gaming)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: ztkedou/KernelSU-NEXT_Mi-ares
          ref: main
          path: kernel

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses-dev \
            curl git cpio gzip unzip device-tree-compiler python3 zstd wget

      - name: Integrate KernelSU-Next (manual, dev branch)
        working-directory: kernel
        run: |
          # Upstream ares repo has a DANGLING submodule entry "KernelSU-Next"
          # (type: submodule with no URL) -> dir exists but is empty, which
          # silently defeats setup.sh's `test -d` check. Also the fake
          # drivers/kernelsu "symlink" is a plain 23-byte text file.
          # Do the integration manually and idempotently:
          rm -rf KernelSU-Next drivers/kernelsu
          # Real source: default branch is `dev` (there is NO `next` branch)
          git clone --depth=1 https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU-Next
          echo "=== kernel dir in KSU-Next ==="
          ls KernelSU-Next/kernel/ | head -8
          test -f KernelSU-Next/kernel/Makefile || { echo "KSU kernel source missing"; exit 1; }
          # Real symlink (was committed as plain text file by upstream author)
          ln -s ../KernelSU-Next/kernel drivers/kernelsu
          ls -la drivers/kernelsu
          # Ensure build hooks in drivers/Makefile and drivers/Kconfig
          grep -q "obj-\$(CONFIG_KSU)" drivers/Makefile || echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig || echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
          tail -3 drivers/Makefile
          tail -3 drivers/Kconfig
          echo "=== KSU integration OK ==="

      - name: Force KSU config on
        working-directory: kernel
        run: |
          sed -i '/CONFIG_KSU=/d; /# CONFIG_KSU is not set/d' arch/arm64/configs/ares_user_defconfig
          echo 'CONFIG_KSU=y' >> arch/arm64/configs/ares_user_defconfig
          grep -i 'CONFIG_KSU' arch/arm64/configs/ares_user_defconfig

      - name: Download Neutron clang (tag 10032024, glibc 2.39)
        working-directory: kernel
        run: |
          curl -s https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman -o antman.sh
          chmod +x antman.sh
          mkdir -p clang
          cd clang
          bash ../antman.sh -S=10032024
          echo "=== clang version ==="
          bin/clang --version | head -3

      - name: Build kernel
        working-directory: kernel
        run: |
          export PATH="$PWD/clang/bin:$PATH"
          make O=out ARCH=arm64 ares_user_defconfig
          make -j$(nproc --all) O=out ARCH=arm64 \
            CC="clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE="$PWD/clang/bin/aarch64-linux-gnu-" \
            CROSS_COMPILE_ARM32="$PWD/clang/bin/arm-linux-gnueabi-" \
            LD=ld.lld STRIP=llvm-strip AS=llvm-as AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump \
            CONFIG_NO_ERROR_ON_MISMATCH=y 2>&1 | tee build.log
          echo "=== artifacts ==="
          find out -name 'Image*' -o -name '*.dtb' | head -20

      - name: Collect artifact
        run: |
          mkdir -p out_artifact
          IMG=$(find kernel/out -name 'Image.gz-dtb' | head -1)
          if [ -z "$IMG" ]; then IMG=$(find kernel/out -name 'Image' | head -1); fi
          echo "IMG=$IMG"
          cp "$IMG" out_artifact/Image.gz-dtb
          ls -lh out_artifact/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernelsu-next-ares-Image
          path: out_artifact/Image.gz-dtb
          retention-days: 30
