name: Build KernelSU-Next for ares (K40 Gaming)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: ztkedou/KernelSU-NEXT_Mi-ares
          ref: main
          path: kernel

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses-dev \
            curl git cpio gzip unzip device-tree-compiler python3 zstd wget

      - name: Integrate KernelSU-Next (manual, dev branch)
        working-directory: kernel
        run: |
          # Upstream ares repo has a DANGLING submodule entry "KernelSU-Next"
          # (type: submodule with no URL) -> dir exists but is empty, which
          # silently defeats setup.sh's `test -d` check. Also the fake
          # drivers/kernelsu "symlink" is a plain 23-byte text file.
          # Do the integration manually and idempotently:
          rm -rf KernelSU-Next drivers/kernelsu
          # v1.0.9 = legacy-manual mode kernel code, hooks match this tree's
          # fs/exec.c/open.c/stat.c/read_write.c/input.c manual hooks, and its
          # Kconfig has NO KPROBES dependency (dev mainline KSU requires
          # KPROBES which ares defconfig disables -> CONFIG_KSU silently
          # dropped -> "manager not integrated"). LSM task_prctl handles
          # supercalls (CONFIG_KSU_LSM_SECURITY_HOOKS default y).
          git clone --depth=1 -b v1.0.9 https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU-Next
          test -f KernelSU-Next/kernel/ksu.c || { echo "v1.0.9 kernel source missing"; exit 1; }
          grep -q "int ksu_handle_execveat" KernelSU-Next/kernel/ksu.c && echo "hook API verified"
          echo "=== kernel dir in KSU-Next ==="
          ls KernelSU-Next/kernel/ | head -8
          test -f KernelSU-Next/kernel/Makefile || { echo "KSU kernel source missing"; exit 1; }
          # Real symlink (was committed as plain text file by upstream author)
          ln -s ../KernelSU-Next/kernel drivers/kernelsu
          ls -la drivers/kernelsu
          # Ensure build hooks in drivers/Makefile and drivers/Kconfig
          grep -q "obj-\$(CONFIG_KSU)" drivers/Makefile || echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig || echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
          tail -3 drivers/Makefile
          tail -3 drivers/Kconfig
          echo "=== KSU integration OK ==="

      - name: Patch missing netfilter files (Windows-case-loss export holes)
        working-directory: kernel
        run: |
          # Every UPPERCASE-named file was lost when the tree was exported on a
          # case-insensitive filesystem. Restore all of them from Xiaomi's
          # official MiCode ares-r-oss branch (single authoritative source).
          declare -A FILES=(
            ["net/netfilter/xt_TCPMSS.c"]="net/netfilter/xt_TCPMSS.c"
            ["net/netfilter/xt_DSCP.c"]="net/netfilter/xt_DSCP.c"
            ["net/netfilter/xt_HL.c"]="net/netfilter/xt_HL.c"
            ["net/netfilter/xt_RATEEST.c"]="net/netfilter/xt_RATEEST.c"
            ["include/uapi/linux/netfilter/xt_TCPMSS.h"]="include/uapi/linux/netfilter/xt_TCPMSS.h"
            ["include/uapi/linux/netfilter/xt_CONNMARK.h"]="include/uapi/linux/netfilter/xt_CONNMARK.h"
            ["include/uapi/linux/netfilter/xt_DSCP.h"]="include/uapi/linux/netfilter/xt_DSCP.h"
            ["include/uapi/linux/netfilter/xt_MARK.h"]="include/uapi/linux/netfilter/xt_MARK.h"
            ["include/uapi/linux/netfilter/xt_RATEEST.h"]="include/uapi/linux/netfilter/xt_RATEEST.h"
            ["include/uapi/linux/netfilter_ipv4/ipt_ECN.h"]="include/uapi/linux/netfilter_ipv4/ipt_ECN.h"
            ["include/uapi/linux/netfilter_ipv4/ipt_TTL.h"]="include/uapi/linux/netfilter_ipv4/ipt_TTL.h"
            ["include/uapi/linux/netfilter_ipv6/ip6t_HL.h"]="include/uapi/linux/netfilter_ipv6/ip6t_HL.h"
          )
          FAIL=0
          for dst in "${!FILES[@]}"; do
            src="${FILES[$dst]}"
            curl -fsSL "https://raw.githubusercontent.com/MiCode/Xiaomi_Kernel_OpenSource/ares-r-oss/${src}" -o "${dst}" || { echo "FAILED: ${src}"; FAIL=1; }
          done
          ls -la net/netfilter/xt_TCPMSS.c net/netfilter/xt_DSCP.c net/netfilter/xt_HL.c net/netfilter/xt_RATEEST.c
          [ "$FAIL" = "0" ] || exit 1
          echo "=== all 12 files restored ==="

      - name: Force KSU config on
        working-directory: kernel
        run: |
          sed -i '/CONFIG_KSU=/d; /# CONFIG_KSU is not set/d' arch/arm64/configs/ares_user_defconfig
          echo 'CONFIG_KSU=y' >> arch/arm64/configs/ares_user_defconfig
          grep -i 'CONFIG_KSU' arch/arm64/configs/ares_user_defconfig

      - name: Download Neutron clang (tag 10032024, glibc 2.39)
        working-directory: kernel
        run: |
          curl -s https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman -o antman.sh
          chmod +x antman.sh
          mkdir -p clang
          cd clang
          bash ../antman.sh -S=10032024
          echo "=== clang version ==="
          bin/clang --version | head -3

      - name: Build kernel
        working-directory: kernel
        run: |
          set -o pipefail
          export PATH="$PWD/clang/bin:$PATH"
          make O=out ARCH=arm64 ares_user_defconfig
          make -j$(nproc --all) O=out ARCH=arm64 \
            CC="clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE="$PWD/clang/bin/aarch64-linux-gnu-" \
            CROSS_COMPILE_ARM32="$PWD/clang/bin/arm-linux-gnueabi-" \
            LD=ld.lld STRIP=llvm-strip AS=llvm-as AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump \
            CONFIG_NO_ERROR_ON_MISMATCH=y 2>&1 | tee build.log
          echo "=== artifacts ==="
          find out -maxdepth 4 -name 'Image*' -o -maxdepth 4 -name '*.dtb' | head -20

      - name: Collect artifact
        run: |
          mkdir -p out_artifact
          IMG=$(find kernel/out -name 'Image.gz-dtb' | head -1)
          if [ -z "$IMG" ]; then IMG=$(find kernel/out -name 'Image' | head -1); fi
          echo "IMG=$IMG"
          cp "$IMG" out_artifact/Image.gz-dtb
          ls -lh out_artifact/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernelsu-next-ares-Image
          path: out_artifact/Image.gz-dtb
          retention-days: 30
